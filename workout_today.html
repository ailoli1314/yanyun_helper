<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>休息日 - 健身计划</title>
<style>

:root {
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #2d3436;
    --text-secondary: #636e72;
    --accent: #0984e3;
    --accent-light: #dfe6e9;
    --success: #00b894;
    --warning: #fdcb6e;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
}
[data-theme="dark"] {
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --text: #eaeaea;
    --text-secondary: #a0a0a0;
    --accent: #4cc9f0;
    --accent-light: #2a3f5f;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 100px; transition: background 0.3s, color 0.3s; min-height: 100vh; }
.theme-toggle { position: fixed; top: 16px; right: 16px; z-index: 999; background: var(--card-bg); border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
.header { text-align: center; margin: 30px 0 20px; }
.date-info { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
.day-title { font-size: 26px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.day-desc { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; }
.day-summary { background: var(--card-bg); border-radius: var(--radius); padding: 14px 18px; margin: 14px 0; box-shadow: var(--shadow); display: flex; justify-content: space-around; text-align: center; }
.summary-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.summary-num { font-size: 24px; font-weight: 700; color: var(--accent); }
.summary-label { font-size: 12px; color: var(--text-secondary); }
.divider { text-align: center; color: var(--text-secondary); font-size: 13px; margin: 24px 0 16px; display: flex; align-items: center; gap: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--accent-light); }
.exercise-card { background: var(--card-bg); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; transition: transform 0.2s, opacity 0.3s; cursor: pointer; }
.exercise-card:active { transform: scale(0.98); }
.exercise-card.done { opacity: 0.45; }
.exercise-img { width: 100%; height: 180px; object-fit: cover; object-position: center; display: block; background: var(--accent-light); cursor: pointer; }
.card-header { padding: 16px 18px 10px; border-bottom: 1px solid var(--accent-light); }
.card-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.card-emoji { font-size: 28px; }
.card-title { font-size: 18px; font-weight: 700; }
.card-en { font-size: 12px; color: var(--text-secondary); margin-left: 38px; font-style: italic; }
.sets-label { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-top: 8px; }
/* weight input */
.weight-row { margin: 10px 0 4px; }
.weight-input { width: 100%; padding: 7px 12px; border: 1.5px solid var(--accent-light); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
.weight-input:focus { border-color: var(--accent); }
.weight-input::placeholder { color: var(--text-secondary); font-weight: 400; font-size: 13px; }
.card-body { padding: 14px 18px 16px; }
.parts-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.part-badge { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: white; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
.part-badge.secondary { background: linear-gradient(135deg, #74b9ff, #0984e3); }
.section-title { font-size: 13px; font-weight: 700; color: var(--accent); margin: 14px 0 8px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; }
.step-num { background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.tips { display: flex; flex-direction: column; gap: 6px; }
.tip { background: var(--accent-light); color: var(--text); font-size: 13px; padding: 8px 12px; border-radius: 10px; line-height: 1.5; border-left: 3px solid var(--warning); }
.home-alt { background: #e8f5e9; color: #2e7d32; font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-top: 14px; line-height: 1.5; }
[data-theme="dark"] .home-alt { background: #1b3a2a; color: #81c784; }
.footer { text-align: center; margin-top: 40px; padding: 20px; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--accent-light); }
.progress-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 12px 20px 20px; box-shadow: 0 -2px 12px rgba(0,0,0,0.1); z-index: 100; }
.progress-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.progress-track { background: var(--accent-light); border-radius: 6px; height: 6px; overflow: hidden; }
.progress-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; border-radius: 6px; transition: width 0.5s; }
.btn-save { background: var(--success); color: white; border: none; border-radius: 12px; padding: 10px 28px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn-save:active { opacity: 0.85; }
.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; cursor: pointer; align-items: center; justify-content: center; }
.lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }

</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀</button>
<div class="header">
<div class="date-info">2026年04月28日 周二</div>
<div class="day-title">😴 休息日</div>
<div class="day-desc">充分休息，恢复肌肉</div>
</div>
<div class="day-summary">
<div class="summary-item"><span class="summary-num">0</span><span class="summary-label">训练动作</span></div>
<div class="summary-item"><span class="summary-num">0</span><span class="summary-label">总组数</span></div>
<div class="summary-item"><span class="summary-num">0</span><span class="summary-label">预计分钟</span></div>
</div>
<div class="divider">💪 训练动作 💪</div>

<div class="footer">
<p>📝 编辑 <code>workout_config.json</code> 即可修改训练计划</p>
<p style="margin-top:6px">由 OpenClaw 自动生成 · 2026年04月28日</p>
</div>
<div class="progress-bar">
<div class="progress-label">今日训练完成进度 <span id="pctText">0/0</span></div>
<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div style="text-align:center;margin-top:8px">
<button class="btn-save" id="saveBtn" data-current-day="rest" onclick="confirmAndSave()">✔ 确认完成</button>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg"></div>
<script>

var REPO = 'ailoli1314/yanyun_helper';
var TOKEN_KEY = 'gh_token_workout';
var pageTitle = document.querySelector('.day-title').textContent.trim();
var today = new Date();
var dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

function toggleTheme() {
    var dark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', dark ? '' : 'dark');
    document.getElementById('themeBtn').textContent = dark ? '\u2600' : '\U0001f319';
    localStorage.setItem('theme', dark ? 'light' : 'dark');
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').textContent = '\U0001f319';
}

var completed = 0;
var total = document.querySelectorAll('.exercise-card').length;

function updateProgress() {
    var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('pctText').textContent = completed + '/' + total;
}

function toggleDone(card, e) {
    if (e.target.closest('.home-alt') || e.target.closest('input') || e.target.tagName === 'INPUT') return;
    card.classList.toggle('done');
    completed = document.querySelectorAll('.exercise-card.done').length;
    updateProgress();
}

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

function getToken() {
    var tok = localStorage.getItem(TOKEN_KEY);
    if (!tok) {
        tok = prompt('请输入 GitHub PAT（仅需 repos 权限）：');
        if (tok) { localStorage.setItem(TOKEN_KEY, tok); }
    }
    return tok;
}

async function confirmAndSave() {
    var token = getToken();
    if (!token) return;

    var doneCards = Array.from(document.querySelectorAll('.exercise-card.done'));
    if (doneCards.length === 0) {
        showToast('请先点击动作卡片标记完成');
        return;
    }

    document.getElementById('saveBtn').textContent = '保存中...';
    document.getElementById('saveBtn').disabled = true;

    var exercises = doneCards.map(function(card) {
        var name = card.querySelector('.card-title').textContent.trim();
        var sets = card.querySelector('.sets-label') ? card.querySelector('.sets-label').textContent.trim() : '';
        var weightEl = card.querySelector('.weight-input');
        var weight = weightEl && weightEl.value.trim() ? weightEl.value.trim() : '';
        return { name: name, sets: sets, weight: weight };
    });

    var logEntry = {
        date: dateStr,
        dayName: pageTitle,
        completed: exercises.length,
        total: total,
        percent: Math.round((exercises.length / total) * 100),
        timestamp: new Date().toISOString(),
        exercises: exercises
    };

    try {
        var sha = null;
        var currentLog = {};
        var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/training_log.json', {
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (r.ok) {
            var d = await r.json();
            sha = d.sha;
            try { currentLog = JSON.parse(atob(d.content)); } catch(e) {}
        }

        currentLog[dateStr] = logEntry;
        currentLog.lastUpdated = new Date().toISOString();

        var body = JSON.stringify({
            message: 'Training log ' + dateStr,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(currentLog, null, 2)))),
            sha: sha
        });

        var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/training_log.json', {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: body
        });

        if (res.ok) {
            showToast('✅ 已保存！正在推进...');
            document.getElementById('saveBtn').textContent = '进度中...';
            // 推进 current_day
            advanceCurrentDay(token).then(function(nxt) {
                showToast('✅ 已完成！即将显示下一天...');
                setTimeout(function(){location.reload();}, 1500);
            }).catch(function(err) {
                showToast('⚠ 推进失败: ' + (err.message || err));
                document.getElementById('saveBtn').textContent = '✔ 确认完成';
                document.getElementById('saveBtn').disabled = false;
            });
        } else {
            var err = await res.json();
            showToast('⚠ ' + (err.message || res.status));
            document.getElementById('saveBtn').textContent = '✔ 确认完成';
            document.getElementById('saveBtn').disabled = false;
        }
    } catch(e) {
        showToast('⚠ 网络错误');
        document.getElementById('saveBtn').textContent = '✔ 确认完成';
        document.getElementById('saveBtn').disabled = false;
    }
}

async function advanceCurrentDay(token) {
    // 读取本地 config
    var currentDay = document.getElementById('saveBtn').getAttribute('data-current-day');
    var seq = ['day1','day2','day3'];
    var curIdx = seq.indexOf(currentDay);
    if (curIdx < 0) curIdx = 0;
    var nxt = seq[(curIdx + 1) % seq.length];

    // 读取 GitHub 上的 config 获取 SHA
    var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/workout_config.json', {
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!r.ok) throw new Error('read config failed');
    var data = await r.json();
    var sha = data.sha;

    // 修改 current_day
    var cfg = JSON.parse(atob(data.content));
    cfg.current_day = nxt;
    var body = JSON.stringify({
        message: 'Advance to ' + nxt,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(cfg, null, 2)))),
        sha: sha
    });
    var res = await fetch('https://api.github.com/repos/' + REPO + '/contents/workout_config.json', {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: body
    });
    if (!res.ok) {
        var err = await res.json();
        throw new Error(err.message || res.status);
    }
    return nxt;
}

// Restore progress from localStorage
var savedCount = parseInt(localStorage.getItem('workout_done_' + dateStr) || '0');
if (savedCount > 0) {
    var cards = document.querySelectorAll('.exercise-card');
    var toMark = Math.min(savedCount, cards.length);
    for (var i = 0; i < toMark; i++) {
        cards[i].classList.add('done');
    }
    completed = toMark;
    updateProgress();
}

</script>
</body>
</html>
