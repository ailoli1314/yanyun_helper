<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏋️ 健身计划 - yanyun_helper</title>
<style>
:root{--bg:#f5f6fa;--card-bg:#fff;--text:#2d3436;--text-sec:#636e72;--accent:#0984e3;--accent-light:#dfe6e9;--success:#00b894;--warning:#fdcb6e;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:16px}
[data-theme=dark]{--bg:#1a1a2e;--card-bg:#16213e;--text:#eaeaea;--text-sec:#a0a0a0;--accent:#4cc9f0;--accent-light:#2a3f5f;--shadow:0 2px 12px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:16px;padding-bottom:80px;transition:background .3s,color .3s;min-height:100vh}
.theme-toggle{position:fixed;top:16px;right:16px;z-index:999;background:var(--card-bg);border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.header{text-align:center;margin:30px 0 20px}
.date-info{font-size:14px;color:var(--text-sec);margin-bottom:6px}
.day-title{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:6px}
.day-desc{font-size:15px;color:var(--text-sec);margin-bottom:4px}
.day-summary{background:var(--card-bg);border-radius:var(--radius);padding:14px 18px;margin:14px 0;box-shadow:var(--shadow);display:flex;justify-content:space-around;text-align:center}
.summary-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.summary-num{font-size:24px;font-weight:700;color:var(--accent)}
.summary-label{font-size:12px;color:var(--text-sec)}
.divider{text-align:center;color:var(--text-sec);font-size:13px;margin:24px 0 16px;display:flex;align-items:center;gap:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--accent-light)}
.exercise-card{background:var(--card-bg);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s}
.exercise-card:active{transform:scale(.98)}
.exercise-card.done{opacity:.45}
.exercise-img{width:100%;height:180px;object-fit:cover;object-position:center;display:block;background:var(--accent-light);cursor:pointer}
.card-header{padding:16px 18px 12px;border-bottom:1px solid var(--accent-light)}
.card-title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card-emoji{font-size:28px}
.card-title{font-size:18px;font-weight:700}
.card-en{font-size:12px;color:var(--text-sec);margin-left:38px;font-style:italic}
.sets-label{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:8px}
.weight-row{margin:8px 0 2px}
.weight-input{width:100%;padding:6px 10px;border:1.5px solid var(--accent-light);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-weight:600;outline:none;box-sizing:border-box}
.weight-input:focus{border-color:var(--accent)}
.weight-input::placeholder{color:var(--text-sec);font-weight:400}
.card-body{padding:14px 18px 16px}
.parts-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.part-badge{background:linear-gradient(135deg,#ff6b6b,#ee5a5a);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px}
.part-badge.secondary{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.section-title{font-size:13px;font-weight:700;color:var(--accent);margin:14px 0 8px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5}
.step-num{background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.tips{display:flex;flex-direction:column;gap:6px}
.tip{background:var(--accent-light);color:var(--text);font-size:13px;padding:8px 12px;border-radius:10px;line-height:1.5;border-left:3px solid var(--warning)}
.home-alt{background:#e8f5e9;color:#2e7d32;font-size:13px;padding:10px 14px;border-radius:10px;margin-top:14px;line-height:1.5}
[data-theme=dark] .home-alt{background:#1b3a2a;color:#81c784}
.footer{text-align:center;margin-top:40px;padding:20px;color:var(--text-sec);font-size:12px;border-top:1px solid var(--accent-light)}
.progress-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);padding:12px 20px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:100}
.progress-label{font-size:12px;color:var(--text-sec);margin-bottom:6px}
.progress-track{background:var(--accent-light);border-radius:6px;height:6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--success));height:100%;border-radius:6px;transition:width .5s}
.btn-save{background:var(--success);color:#fff;border:none;border-radius:10px;padding:9px 24px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:9999;cursor:pointer;align-items:center;justify-content:center}
.lightbox img{max-width:95%;max-height:95%;object-fit:contain;border-radius:8px}
.loading{text-align:center;padding:60px 20px;font-size:18px;color:var(--text-sec)}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>
<div class="loading" id="loading">📥 加载训练计划中...</div>
<div id="content" style="display:none"></div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
var REPO='ailoli1314/yanyun_helper';
var TOKEN_KEY='gh_token_workout';
var today=new Date();
var dateStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
var completed=0,total=0,pageTitle='';

// 图片文件名映射
var IMAGE_MAP={
  "平板卧推":"bench_press.jpg",
  "上斜哑铃卧推":"incline_dumbbell_press.png",
  "哑铃肩推":"dumbbell_shoulder_press.jpg",
  "侧平举":"lateral_raise.png",
  "绳索/器械肱三头肌下压":"tricep_pushdown.gif",
  "高位下拉":"lat_pulldown.jpg",
  "坐姿划船":"seated_cable_row.jpg",
  "面拉":"face_pull.png",
  "杠铃弯举":"barbell_curl.png",
  "悬垂举腿":"hanging_leg_raise.png",
  "深蹲":"barbell_squat.jpg",
  "单腿蹲":"bulgarian_split_squat.gif",
  "罗马尼亚硬拉":"romanian_deadlift.png",
  "腿弯举":"leg_curl.jpg",
  "提踵":"calf_raise.png"
};

function getImgURL(name){
  var f=IMAGE_MAP[name];
  return f?'https://raw.githubusercontent.com/'+REPO+'/main/images/'+f:'';
}

function hexToBytes(h){
  var b=[];
  for(var i=0;i<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));
  return new Uint8Array(b);
}
function deb64(s){
  return decodeURIComponent(Array.from(function*(s2){
    var b=atob(s2.replace(/-/g,'+').replace(/_/g,'/'));
    for(var i=0;i<b.length;i++)yield '%'+('00'+b.charCodeAt(i).toString(16)).slice(-2);
  }(s)).join(''));
}
function enb64(s){
  try{return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(m,p){return String.fromCharCode(parseInt(p,16));}));}
  catch(e){return null;}
}
function toggleTheme(){
  var d=document.body.getAttribute('data-theme')==='dark';
  document.body.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('themeBtn').textContent=d?'☀️':'🌙';
  localStorage.setItem('theme',d?'light':'dark');
}
if(localStorage.getItem('theme')==='dark'){
  document.body.setAttribute('data-theme','dark');
  document.getElementById('themeBtn').textContent='🌙';
}
function getToken(){
  var tok=localStorage.getItem(TOKEN_KEY);
  if(!tok&&window.__gh_token)tok=window.__gh_token;
  return tok||'';
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._hide);t._hide=setTimeout(function(){t.classList.remove('show');},2000);
}

function toggleDone(el,ev){
  if(ev&&(ev.target.tagName==='INPUT'||ev.target.tagName==='IMG'))return;
  el.classList.toggle('done');
  completed=document.querySelectorAll('.exercise-card.done').length;
  updateProgress();
  localStorage.setItem('workout_done_'+dateStr,completed);
}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').style.display='flex';}
function updateProgress(){
  var pct=total>0?Math.round((completed/total)*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=completed+'/'+total+' ('+pct+'%)';
}

function buildPage(dayCfg, dayId, weightsMap){
  weightsMap=weightsMap||{};
  var d=dayCfg;
  var emoji=d.emoji||'🏋️';
  pageTitle=emoji+' '+d.name;

  var html='<div class="header">'+
    '<div class="date-info">'+today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日 '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][today.getDay()]+'</div>'+
    '<div class="day-title">'+emoji+' '+d.name+'</div>'+
    '<div class="day-desc">'+d.description+'</div>'+
    '</div>';

  var exs=d.exercises||[];
  total=exs.length;
  html+='<div class="day-summary">'+
    '<div class="summary-item"><span class="summary-num" id="summaryTotal">'+total+'</span><span class="summary-label">训练动作</span></div>'+
    '<div class="summary-item"><span class="summary-num">'+(total>0?total*4+'':'0')+'</span><span class="summary-label">总组数</span></div>'+
    '<div class="summary-item"><span class="summary-num">'+(total>0?total*6+'':'0')+'</span><span class="summary-label">预计分钟</span></div>'+
    '</div>';

  html+='<div class="divider">💪 训练动作 💪</div>';

  exs.forEach(function(ex,i){
    var setsStr=ex.sets_reps||ex.sets||'';
    var imgSrc=getImgURL(ex.name);
    html+='<div class="exercise-card" onclick="toggleDone(this,event)">';
    if(imgSrc)html+='<img class="exercise-img" src="'+imgSrc+'" alt="'+ex.name+'" loading="lazy" onclick="event.stopPropagation();openLightbox(this.src)" onerror="this.style.display=\'none\'">';
    html+='<div class="card-header">'+
      '<div class="card-title-row"><span class="card-emoji">'+(ex.emoji||'💪')+'</span><span class="card-title">'+ex.name+'</span></div>'+
      (ex.name_en?'<div class="card-en">'+ex.name_en+'</div>':'')+
      (setsStr?'<div class="sets-label">'+setsStr+'</div>':'')+
      '<div class="weight-row"><input class="weight-input" type="text" placeholder="今日重量（如 50kg）" value="'+(weightsMap[ex.name]||'')+'" onclick="event.stopPropagation()"></div>'+
      '</div>'+
      '<div class="card-body">'+
      '<div class="parts-row">'+
      '<span class="part-badge">'+ex.primary+'</span>'+
      (ex.secondary&&ex.secondary!=='无'&&ex.secondary!=='无',''?'<span class="part-badge secondary">'+ex.secondary+'</span>':'')+
      '</div>';

    // Rest
    if(ex.rest)html+='<div style="font-size:13px;color:var(--text-sec);margin-bottom:10px">⏱️ 休息：'+ex.rest+'</div>';

    // Steps
    if(ex.steps&&ex.steps.length){
      html+='<div class="section-title">📝 动作步骤</div><div class="steps">';
      ex.steps.forEach(function(s,j){html+='<div class="step"><div class="step-num">'+(j+1)+'</div><span>'+s+'</span></div>';});
      html+='</div>';
    }

    // Tips
    if(ex.tips&&ex.tips.length){
      html+='<div class="section-title">💡 动作要点</div><div class="tips">';
      ex.tips.forEach(function(t){html+='<div class="tip">'+t+'</div>';});
      html+='</div>';
    }

    // Home alternative
    if(ex.home_alternative)html+='<div class="home-alt">🏠 居家替代：'+ex.home_alternative+'</div>';

    html+='</div></div>';
  });

  html+='<div class="footer">'+
    '<p>💡 编辑 <code>workout_config.json</code> 即可修改训练计划</p>'+
    '<p>数据从 GitHub 动态加载 · current_day = '+dayId+'</p>'+
    '</div>';

  html+='<div class="progress-bar">'+
    '<div class="progress-label" style="display:flex;justify-content:space-between">'+
    '<span>今日进度</span><span id="progressText">0/'+total+' (0%)</span></div>'+
    '<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>'+
    '<div style="display:flex;justify-content:center;gap:10px;margin-top:10px">'+
    '<button class="btn-save" id="saveBtn" onclick="saveToGithub()">✅ 确认完成</button>'+
    '</div></div>';

  document.getElementById('content').innerHTML=html;
  document.getElementById('content').style.display='block';
  document.getElementById('loading').style.display='none';

  // Restore saved state
  var saved=parseInt(localStorage.getItem('workout_done_'+dateStr)||'0');
  if(saved>0){
    var cards=document.querySelectorAll('.exercise-card');
    var mark=Math.min(saved,cards.length);
    for(var i=0;i<mark;i++)cards[i].classList.add('done');
    completed=mark;updateProgress();
  }
}

async function loadConfig(){
  try{
    // 10秒超时保护
    var ac=new AbortController();
    var tid=setTimeout(function(){ac.abort();},10000);

    // 公开仓库读数据不需要 token
    var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/workout_config.json',{
      signal:ac.signal,
      cache:'no-cache',
      headers:{'Accept':'application/vnd.github.v3+json'}
    });
    if(!r.ok){clearTimeout(tid);document.getElementById('loading').textContent='❌ 加载失败: '+r.status;return;}
    var data=await r.json();
    var cfg=JSON.parse(deb64(data.content));
    var cur=cfg.current_day||'day1';
    var days=cfg.days||{};
    var dayObj=days[cur];
    if(!dayObj){document.getElementById('loading').textContent='❌ 找不到 day: '+cur;return;}
    dayObj.name=dayObj.name||(cur.charAt(0).toUpperCase()+cur.slice(1));
    clearTimeout(tid);
    var dayName=dayObj.emoji+' '+dayObj.name;

    // 同时获取训练日志，找到最近一次同类型训练的重量
    var weightsMap={};
    try{
      var logR=await fetch('https://api.github.com/repos/'+REPO+'/contents/training_log.json',{
        headers:{'Accept':'application/vnd.github.v3+json'}
      });
      if(logR.ok){
        var logData=await logR.json();
        var log=JSON.parse(deb64(logData.content));
        // 找日期最大且 dayName 匹配的那次
        var lastMatch=null;
        var dates=Object.keys(log).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k);});
        dates.sort().reverse();
        for(var di=0;di<dates.length;di++){
          var entry=log[dates[di]];
          if(entry.dayName===dayName){
            lastMatch=entry;
            break;
          }
        }
        if(lastMatch&&lastMatch.exercises){
          lastMatch.exercises.forEach(function(ex){
            if(ex.name&&ex.weight)weightsMap[ex.name]=ex.weight;
          });
        }
      }
    }catch(e){/* 训练日志加载失败不影响主流程 */}

    buildPage(dayObj,cur,weightsMap);
  }catch(e){
    clearTimeout(tid);
    document.getElementById('loading').textContent='❌ 加载失败: '+(e.message||e);
  }
}

async function saveToGithub(){
  var token=getToken();
  if(!token){
    var t=prompt('请输入 GitHub Token（用于保存训练记录）');
    if(!t)return;
    localStorage.setItem(TOKEN_KEY,t);token=t;
  }
  var doneCards=Array.from(document.querySelectorAll('.exercise-card.done'));
  if(doneCards.length===0){showToast('请先点击动作卡片标记完成');return;}
  document.getElementById('saveBtn').textContent='保存中...';
  document.getElementById('saveBtn').disabled=true;
  var exercises=doneCards.map(function(card){
    var n=card.querySelector('.card-title')?card.querySelector('.card-title').textContent.trim():'';
    var s=card.querySelector('.sets-label')?card.querySelector('.sets-label').textContent.trim():'';
    var w=card.querySelector('.weight-input');
    var wv=w&&w.value.trim()?w.value.trim():'';
    return{name:n,sets:s,weight:wv};
  });
  var logEntry={date:dateStr,dayName:pageTitle,completed:exercises.length,total:total,percent:Math.round((exercises.length/total)*100),timestamp:new Date().toISOString(),exercises:exercises};
  try{
    var sha=null;var currentLog={};
    var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/training_log.json',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){var d=await r.json();sha=d.sha;try{currentLog=JSON.parse(deb64(d.content));}catch(e){currentLog={};}}
    currentLog[dateStr]=logEntry;
    currentLog.lastUpdated=new Date().toISOString();
    var bc=enb64(JSON.stringify(currentLog,null,2));
    if(!bc)throw new Error('encode');
    var body=JSON.stringify({message:'Training log '+dateStr,content:bc,sha:sha});
    var res=await fetch('https://api.github.com/repos/'+REPO+'/contents/training_log.json',{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:body});
    if(res.ok){
      showToast('✅ 已保存！正在推进...');
      document.getElementById('saveBtn').textContent='推进中...';
      advanceCurrentDay(token).then(function(){
        showToast('✅ 已完成！即将显示下一天...');
        setTimeout(function(){location.reload();},1500);
      }).catch(function(err){
        showToast('⚠ 推进失败: '+(err.message||err));
        document.getElementById('saveBtn').textContent='✅ 确认完成';
        document.getElementById('saveBtn').disabled=false;
      });
    }else{
      var err=await res.json();
      showToast('⚠ '+(err.message||res.status));
      document.getElementById('saveBtn').textContent='✅ 确认完成';
      document.getElementById('saveBtn').disabled=false;
    }
  }catch(e){
    showToast('⚠ 网络错误');
    document.getElementById('saveBtn').textContent='✅ 确认完成';
    document.getElementById('saveBtn').disabled=false;
  }
}

async function advanceCurrentDay(token){
  var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/workout_config.json',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok)throw new Error('read config failed');
  var data=await r.json();
  var sha=data.sha;
  var cfg=JSON.parse(deb64(data.content));
  var cur=cfg.current_day||'day1';
  var seq=cfg.day_sequence||['day1','day2','day3'];
  var ci=seq.indexOf(cur);if(ci<0)ci=0;
  var nxt=seq[(ci+1)%seq.length];
  cfg.current_day=nxt;
  var cc=enb64(JSON.stringify(cfg,null,2));if(!cc)throw new Error('encode');
  var body=JSON.stringify({message:'Advance to '+nxt,content:cc,sha:sha});
  var res=await fetch('https://api.github.com/repos/'+REPO+'/contents/workout_config.json',{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:body});
  if(!res.ok){var err=await res.json();throw new Error(err.message||res.status);}
}

loadConfig();
</script>
</body>
</html>
