<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看店排班表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    padding: 24px;
  }
  .page {
    max-width: 1040px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    padding: 24px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .toolbar .nav { display: flex; gap: 8px; }
  .toolbar button {
    border: 1px solid #d0d5dd;
    background: #fff;
    color: #333;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .toolbar button:hover { background: #f0f2f5; }
  h1 { font-size: 24px; font-weight: 700; text-align: center; }
  .spacer { width: 160px; }
  .duty-info {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin: 6px 0 4px;
    line-height: 1.8;
  }
  .badge-night {
    display: inline-block;
    background: #2c4a6e; color: #fff;
    padding: 2px 8px; border-radius: 10px; margin: 0 2px;
    font-weight: 700;
  }
  .legend {
    display: flex; gap: 16px; justify-content: center;
    font-size: 13px; color: #555; margin: 10px 0 16px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dot.early { background: #f6c445; }
  .dot.late { background: #2c4a6e; }
  .dot.rest { background: #c9cdd4; }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .cal-head {
    text-align: center;
    font-weight: 600;
    color: #888;
    font-size: 13px;
    padding: 4px 0;
  }
  .cell {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    min-height: 96px;
    padding: 6px;
    background: #fff;
  }
  .cell.blank { background: transparent; border: none; }
  .cell.today { border: 2px solid #f6c445; }
  .day-num {
    font-size: 13px; font-weight: 700; color: #333;
    margin-bottom: 5px;
  }
  .slot {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px;
    border-radius: 4px;
    padding: 3px 5px;
    margin-bottom: 3px;
  }
  .slot .tag {
    font-size: 10px; font-weight: 700;
    padding: 1px 4px; border-radius: 3px;
    flex: 0 0 auto;
  }
  .slot.early { background: #fff4d6; }
  .slot.early .tag { background: #f6c445; color: #5a3c00; }
  .slot.late { background: #2c4a6e; color: #fff; }
  .slot.late .tag { background: #fff; color: #2c4a6e; }
  .slot.rest { background: #f0f1f3; color: #777; }
  .slot.rest .tag { background: #c9cdd4; color: #4a4f57; }
  @media print {
    body { background: #fff; padding: 0; }
    .page { box-shadow: none; border-radius: 0; }
    .toolbar button, .toolbar .nav { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="nav">
      <button id="prev">‹ 上月</button>
      <button id="today">回到本月</button>
      <button id="next">下月 ›</button>
    </div>
    <h1 id="monthTitle"></h1>
    <div class="spacer"></div>
  </div>
  <div class="duty-info" id="dutyInfo"></div>
  <div class="legend">
    <span><i class="dot early"></i>早班</span>
    <span><i class="dot late"></i>晚班</span>
    <span><i class="dot rest"></i>休息</span>
  </div>
  <div class="calendar" id="calendar"></div>
</div>
<script>
  const NAMES = ['可露雪', '可露雪妹', '可露雪妹夫'];
  // 基准：2026年9月上半月 => 晚班主力 = 可露雪（index 0）
  const ANCHOR = 2026 * 24 + (9 - 1) * 2;

  let cur = new Date(); // 默认打开当前月

  function periodIndex(y, m, d) {
    return y * 24 + (m - 1) * 2 + (d > 15 ? 1 : 0);
  }

  function assign(y, m, d) {
    const p = periodIndex(y, m, d);
    const night = ((p - ANCHOR) % 3 + 3) % 3;
    const morning = (night + 1) % 3;
    const cover = (night + 2) % 3;
    const halfStart = d > 15 ? 16 : 1;
    const off = (d - halfStart) % 3;
    let early, late, rest;
    if (off === 0)      { early = morning; late = night;  rest = cover; }
    else if (off === 1) { early = cover;   late = night;  rest = morning; }
    else                { early = morning; late = cover;  rest = night; }
    return { early, late, rest, night, morning, cover };
  }

  function render() {
    const y = cur.getFullYear(), m = cur.getMonth();
    document.getElementById('monthTitle').textContent = y + '年' + (m + 1) + '月';

    const lastDay = new Date(y, m + 1, 0).getDate();
    const info1 = assign(y, m + 1, 1);
    const info2 = lastDay >= 16 ? assign(y, m + 1, 16) : null;

    let html = '上半月(1-15) 晚班主力：<span class="badge-night">' + NAMES[info1.night] + '</span>　早班主力：' + NAMES[info1.morning] + '　顶班：' + NAMES[info1.cover];
    if (info2) {
      html += '　｜　下半月(16-' + lastDay + ') 晚班主力：<span class="badge-night">' + NAMES[info2.night] + '</span>　早班主力：' + NAMES[info2.morning] + '　顶班：' + NAMES[info2.cover];
    }
    document.getElementById('dutyInfo').innerHTML = html;

    const firstDow = new Date(y, m, 1).getDay(); // 0=Sun
    const lead = (firstDow + 6) % 7; // 周一开头
    const cells = [];
    const today = new Date();

    for (let i = 0; i < lead; i++) cells.push('<div class="cell blank"></div>');
    for (let d = 1; d <= lastDay; d++) {
      const a = assign(y, m + 1, d);
      const isToday = (today.getFullYear() === y && today.getMonth() === m && today.getDate() === d);
      cells.push(
        '<div class="cell' + (isToday ? ' today' : '') + '">' +
          '<div class="day-num">' + d + '</div>' +
          '<div class="slot early"><span class="tag">早</span>' + NAMES[a.early] + '</div>' +
          '<div class="slot late"><span class="tag">晚</span>' + NAMES[a.late] + '</div>' +
          '<div class="slot rest"><span class="tag">休</span>' + NAMES[a.rest] + '</div>' +
        '</div>'
      );
    }
    document.getElementById('calendar').innerHTML =
      ['一', '二', '三', '四', '五', '六', '日'].map(h => '<div class="cal-head">' + h + '</div>').join('') +
      cells.join('');
  }

  document.getElementById('prev').onclick  = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); render(); };
  document.getElementById('next').onclick  = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); render(); };
  document.getElementById('today').onclick = () => { cur = new Date(); render(); };
  render();
</script>
</body>
</html>
