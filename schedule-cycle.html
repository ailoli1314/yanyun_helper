<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看店排班表（晚班主力固定周期）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f6f8; color: #1a1a1a; padding: 24px;
  }
  .page {
    max-width: 1040px; margin: 0 auto; background: #fff;
    border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px;
  }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .toolbar .nav { display: flex; gap: 8px; }
  .toolbar button {
    border: 1px solid #d0d5dd; background: #fff; color: #333;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .toolbar button:hover { background: #f0f2f5; }
  h1 { font-size: 24px; font-weight: 700; text-align: center; }
  .spacer { width: 160px; }
  .cycle-setting {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 10px 0 6px; font-size: 14px; color: #444;
  }
  .cycle-setting input {
    width: 70px; padding: 6px 8px; font-size: 15px; font-weight: 700;
    border: 1px solid #d0d5dd; border-radius: 8px; text-align: center;
  }
  .cycle-setting input:focus { outline: 2px solid #2563EB; border-color: #2563EB; }
  .cycle-warning { font-size: 12px; }
  .cycle-warning.ok { color: #16A34A; }
  .cycle-warning.bad { color: #E53E3E; }
  .duty-info { text-align: center; font-size: 14px; color: #555; margin: 4px 0; line-height: 2.0; }
  .badge {
    display: inline-block; color: #fff;
    padding: 2px 9px; border-radius: 10px; margin: 0 2px; font-weight: 700;
  }
  .legend {
    display: flex; gap: 20px; justify-content: center;
    font-size: 14px; color: #444; margin: 12px 0 6px; font-weight: 600;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
  .rule-note {
    text-align: center; font-size: 12px; color: #999; margin: 0 0 14px; line-height: 1.8;
  }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-head { text-align: center; font-weight: 600; color: #888; font-size: 13px; padding: 4px 0; }
  .cell { border: 1px solid #e5e7eb; border-radius: 8px; min-height: 96px; padding: 6px; background: #fff; }
  .cell.blank { background: transparent; border: none; }
  .cell.today { border: 2px solid #f59e0b; }
  .cell.cycle-start { box-shadow: inset 3px 0 0 #f59e0b; }
  .day-num { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 5px; }
  .slot {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; border-radius: 5px;
    padding: 3px 6px; margin-bottom: 3px;
  }
  .shift {
    font-size: 10px; font-weight: 700; color: #6b7280;
    background: rgba(0,0,0,0.07); padding: 1px 5px; border-radius: 3px; flex: 0 0 auto;
  }
  .name { font-weight: 700; }
  @media print {
    body { background: #fff; padding: 0; }
    .page { box-shadow: none; border-radius: 0; }
    .toolbar button, .toolbar .nav, .cycle-setting { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="nav">
      <button id="prev">‹ 上月</button>
      <button id="today">回到本月</button>
      <button id="next">下月 ›</button>
    </div>
    <h1 id="monthTitle"></h1>
    <div class="spacer"></div>
  </div>

  <div class="cycle-setting">
    <label>晚班主力固定周期：</label>
    <input type="number" id="cycleInput" min="3" step="3" value="12">
    <label>天</label>
    <span class="cycle-warning" id="cycleWarning"></span>
  </div>

  <div class="duty-info" id="dutyInfo"></div>
  <div class="legend" id="legend"></div>
  <div class="rule-note" id="ruleNote"></div>
  <div class="calendar" id="calendar"></div>
</div>
<script>
  const NAMES = ['可露雪', '可露雪妹', '可露雪妹夫'];
  const COLORS = [
    { deep: '#2563EB', light: '#DBEAFE' },  // 可露雪 - 蓝
    { deep: '#DB2777', light: '#FCE7F3' },  // 可露雪妹 - 玫红
    { deep: '#16A34A', light: '#DCFCE7' }   // 可露雪妹夫 - 绿
  ];
  const TEMPLATE = [0, 2, 1];          // 3日循环：辅助 休→早→晚（晚班主力=晚晚休）
  const ANCHOR_DATE = Date.UTC(2026, 8, 1); // 基准日 2026-09-01
  const DAY_MS = 86400000;

  let T = 12;                          // 当前周期（天），可改
  let cur = new Date();

  // 所有内部函数统一用 0-indexed 月 m0
  function assign(y, m0, d) {
    const diff = Math.floor((Date.UTC(y, m0, d) - ANCHOR_DATE) / DAY_MS);
    const cycle = Math.floor(diff / T);
    const a = (((-cycle) % 3) + 3) % 3;   // 晚班主力，逆序轮换
    const b = (a + 1) % 3;
    const c = (a + 2) % 3;
    const s = TEMPLATE[((diff % 3) + 3) % 3];
    if (s === 0)      return { early: b, late: a, rest: c };
    else if (s === 1) return { early: b, late: c, rest: a };
    else              return { early: c, late: a, rest: b };
  }

  function badge(nameIdx) {
    return '<span class="badge" style="background:' + COLORS[nameIdx].deep + '">' + NAMES[nameIdx] + '</span>';
  }

  function slotHTML(shift, nameIdx) {
    return '<div class="slot" style="background:' + COLORS[nameIdx].light + ';border-left:3px solid ' + COLORS[nameIdx].deep + '">' +
      '<span class="shift">' + shift + '</span>' +
      '<span class="name" style="color:' + COLORS[nameIdx].deep + '">' + NAMES[nameIdx] + '</span>' +
      '</div>';
  }

  function monthSegments(y, m0) {
    const lastDay = new Date(y, m0 + 1, 0).getDate();
    const segs = [];
    let day = 1;
    while (day <= lastDay) {
      const diff = Math.floor((Date.UTC(y, m0, day) - ANCHOR_DATE) / DAY_MS);
      const daysToNext = T - (((diff % T) + T) % T);
      const end = Math.min(day + daysToNext - 1, lastDay);
      const cycle = Math.floor(diff / T);
      const a = (((-cycle) % 3) + 3) % 3;
      segs.push({ start: day, end: end, lead: a, early: (a + 1) % 3, assist: (a + 2) % 3 });
      day = end + 1;
    }
    return segs;
  }

  function render() {
    const y = cur.getFullYear(), m0 = cur.getMonth();
    document.getElementById('monthTitle').textContent = y + '年' + (m0 + 1) + '月';

    document.getElementById('legend').innerHTML = NAMES.map((n, i) =>
      '<span><i class="dot" style="background:' + COLORS[i].deep + '"></i>' + n + '</span>'
    ).join('');

    // 周期警告
    const w = document.getElementById('cycleWarning');
    if (T % 3 !== 0) {
      w.className = 'cycle-warning bad';
      w.textContent = '⚠ 周期非 3 的倍数会产生「晚→早」倒班，建议用 3/6/9/12/15';
    } else {
      w.className = 'cycle-warning ok';
      w.textContent = '✓ 无「晚→早」倒班';
    }
    document.getElementById('ruleNote').textContent =
      '晚班主力每 ' + T + ' 天轮换 · 周期内上2休1 · 周期切换处晚班连续 3 天（1次/周期）';

    const segs = monthSegments(y, m0);
    document.getElementById('dutyInfo').innerHTML = segs.map(s => {
      const range = s.start === s.end ? s.start + '号' : s.start + '-' + s.end + '号';
      return range + '：晚班主力 ' + badge(s.lead) + '　早班主力 ' + badge(s.early) + '　辅助 ' + badge(s.assist);
    }).join('<br>');

    const lastDay = new Date(y, m0 + 1, 0).getDate();
    const firstDow = new Date(y, m0, 1).getDay();
    const lead = (firstDow + 6) % 7;
    const cells = [];
    const today = new Date();

    for (let i = 0; i < lead; i++) cells.push('<div class="cell blank"></div>');
    for (let d = 1; d <= lastDay; d++) {
      const a = assign(y, m0, d);
      const isToday = (today.getFullYear() === y && today.getMonth() === m0 && today.getDate() === d);
      const diff = Math.floor((Date.UTC(y, m0, d) - ANCHOR_DATE) / DAY_MS);
      const isCycleStart = (((diff % T) + T) % T) === 0;
      cells.push(
        '<div class="cell' + (isToday ? ' today' : '') + (isCycleStart ? ' cycle-start' : '') + '">' +
          '<div class="day-num">' + d + '</div>' +
          slotHTML('早', a.early) +
          slotHTML('晚', a.late) +
          slotHTML('休', a.rest) +
        '</div>'
      );
    }
    document.getElementById('calendar').innerHTML =
      ['一', '二', '三', '四', '五', '六', '日'].map(h => '<div class="cal-head">' + h + '</div>').join('') +
      cells.join('');
  }

  document.getElementById('cycleInput').addEventListener('input', function (e) {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v) && v >= 3) {
      T = v;
      render();
    }
  });

  document.getElementById('prev').onclick  = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); render(); };
  document.getElementById('next').onclick  = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); render(); };
  document.getElementById('today').onclick = () => { cur = new Date(); render(); };
  render();
</script>
</body>
</html>
