<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告 - 游戏秘籍</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">☁️</span><span class="logo-text">游戏秘籍</span></a>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="intro.html">脚本介绍</a></li>
                <li><a href="notice.html" class="active">公告</a></li>
            </ul>
            <a href="#" id="navDownload" class="nav-download">立即下载</a>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>公告中心</h1>
            <p>最新资讯、更新公告、优惠政策</p>
        </div>
    </section>

    <section class="notice-section">
        <div class="container">
            <!-- 加载状态 -->
            <div id="loading" class="loading-container">
                <div class="loading-spinner"></div>
                <p>正在加载公告...</p>
            </div>
            
            <!-- 错误提示 -->
            <div id="error" class="error-container" style="display: none;">
                <div class="error-icon">⚠️</div>
                <p id="error-msg">加载失败，请稍后重试</p>
                <button onclick="loadNotices()" class="btn btn-secondary">重新加载</button>
            </div>

            <!-- 空状态 -->
            <div id="empty" class="empty-container" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>暂无公告</p>
            </div>

            <!-- 公告列表 -->
            <div id="notice-grid" class="notice-grid" style="display: none;"></div>
        </div>
    </section>

    <section class="subscribe-section">
        <div class="container">
            <div class="subscribe-box">
                <h3>📬 订阅更新</h3>
                <p>订阅获取最新公告和更新通知</p>
                <form class="subscribe-form" onsubmit="return false;">
                    <input type="email" placeholder="输入您的邮箱" required>
                    <button type="submit">订阅</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><span class="logo-icon">☁️</span><span>游戏秘籍</span></div>
                <p class="footer-desc">让游戏操作更简单</p>
                <div class="footer-links">
                    <a href="index.html">首页</a>
                    <a href="intro.html">脚本介绍</a>
                    <a href="#" id="footerDownload">下载</a>
                </div>
                <p class="footer-copyright">© 2026 游戏秘籍. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 下载渠道选择弹窗 -->
    <div id="downloadModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;">
        <div style="background:#1e1e2e;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:30px;max-width:400px;width:90%;text-align:center;">
            <h3 style="color:#a29bfe;margin-bottom:20px;font-size:1.3rem;">选择下载渠道</h3>
            <div id="downloadChannels" style="display:flex;flex-direction:column;gap:12px;"></div>
            <button onclick="closeDownloadModal()" style="margin-top:20px;padding:8px 24px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#b2bec3;cursor:pointer;font-size:0.9rem;">取消</button>
        </div>
    </div>

    <script src="js/scf-api.js"></script>
    <script src="js/main.js"></script>
    <script>
        var _downloadConfig = null;

        function openDownloadModal(e) {
            if (e) e.preventDefault();
            var config = _downloadConfig;
            if (!config || !config.download) return;

            var channels = [];
            if (config.download.baiduPan) channels.push({ name: '💾 百度网盘', url: config.download.baiduPan, desc: '需登录，非会员限速' });
            if (config.download.aliDrive) channels.push({ name: '☁️ 阿里云盘', url: config.download.aliDrive, desc: '需登录，大文件需客户端' });
            if (config.download.lanzou) channels.push({ name: '📦 蓝奏云', url: config.download.lanzou, desc: '单文件限100MB' });

            if (channels.length === 0) { alert('暂无下载链接，请稍后再试'); return; }
            if (channels.length === 1) { window.open(channels[0].url, '_blank'); return; }

            var container = document.getElementById('downloadChannels');
            container.innerHTML = channels.map(function(ch) {
                return '<a href="' + ch.url + '" target="_blank" style="display:block;padding:14px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#dfe6e9;text-decoration:none;text-align:left;transition:all 0.2s;" onmouseover="this.style.borderColor=\'#6c5ce7\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.15)\'"><div style="font-weight:600;font-size:1rem;">' + ch.name + '</div><div style="color:#b2bec3;font-size:0.8rem;margin-top:4px;">' + ch.desc + '</div></a>';
            }).join('');
            document.getElementById('downloadModal').style.display = 'flex';
        }

        function closeDownloadModal() { document.getElementById('downloadModal').style.display = 'none'; }
        document.getElementById('downloadModal').addEventListener('click', function(e) { if (e.target === this) closeDownloadModal(); });

        document.addEventListener('DOMContentLoaded', async function() {
            const config = await CloudConfig.get();
            if (config && config.download) {
                _downloadConfig = config;
                var hasLink = config.download.baiduPan || config.download.aliDrive || config.download.lanzou;
                if (hasLink) {
                    document.getElementById('navDownload').addEventListener('click', openDownloadModal);
                    document.getElementById('footerDownload').addEventListener('click', openDownloadModal);
                }
            }
        });
    </script>
    <script>
        // 公告类型配置
        const NoticeTypeConfig = {
            labels: {
                'hot': '热门',
                'update': '更新',
                'discount': '优惠',
                'notice': '公告',
                'tutorial': '教程'
            },
            emojis: {
                'hot': '🔥',
                'update': '🔧',
                'discount': '💰',
                'notice': '📢',
                'tutorial': '📚'
            }
        };

        // 加载公告（从 SCF 云端读取，无需鉴权）
        async function loadNotices() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const emptyEl = document.getElementById('empty');
            const gridEl = document.getElementById('notice-grid');

            loadingEl.style.display = 'flex';
            errorEl.style.display = 'none';
            emptyEl.style.display = 'none';
            gridEl.style.display = 'none';

            try {
                const data = await SCF_API.get(SCF_API.NOTICE_KEY);
                const notices = (data && data.notices) || [];
                
                loadingEl.style.display = 'none';
                
                if (!notices || notices.length === 0) {
                    emptyEl.style.display = 'flex';
                    return;
                }

                // 按横向列渲染，卡片放入当前最短列，减少不同正文长度带来的空隙
                const cards = notices.map(notice => {
                    const card = document.createElement('article');
                    card.className = 'notice-card';
                    card.innerHTML = `<div class="notice-badge ${notice.type === 'hot' ? 'hot' : ''}">${escapeHtml(NoticeTypeConfig.labels[notice.type] || '公告')}</div>
                        <div class="notice-date">${escapeHtml(notice.date || '')}</div>
                        <h3>${NoticeTypeConfig.emojis[notice.type] || '📢'} ${escapeHtml(notice.title || '')}</h3>
                        <p>${escapeHtml(notice.content || '')}</p>
                        ${notice.link ? `<a href="${escapeHtml(notice.link)}" class="notice-link">查看详情 →</a>` : ''}`;
                    return card;
                });
                gridEl.style.display = 'flex';
                window._noticeCards = cards;
                renderNoticeMasonry(gridEl, cards);
                
                // 触发滚动动画
                initScrollAnimations();

            } catch (error) {
                console.error('加载公告失败:', error);
                loadingEl.style.display = 'none';
                document.getElementById('error-msg').textContent = '加载失败: ' + error.message;
                errorEl.style.display = 'flex';
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = String(value || '');
            return div.innerHTML;
        }

        function renderNoticeMasonry(container, cards) {
            container.innerHTML = '';
            const columnCount = window.innerWidth <= 768 ? 1 : (window.innerWidth <= 1100 ? 2 : 3);
            const columns = Array.from({ length: columnCount }, () => {
                const column = document.createElement('div');
                column.className = 'notice-masonry-column';
                container.appendChild(column);
                return column;
            });
            cards.forEach(card => {
                const target = columns.reduce((shortest, column) =>
                    column.offsetHeight < shortest.offsetHeight ? column : shortest);
                target.appendChild(card);
            });
        }

        let noticeResizeTimer;
        window.addEventListener('resize', () => {
            if (!window._noticeCards) return;
            clearTimeout(noticeResizeTimer);
            noticeResizeTimer = setTimeout(() => {
                renderNoticeMasonry(document.getElementById('notice-grid'), window._noticeCards);
            }, 150);
        });

        // 初始化滚动动画
        function initScrollAnimations() {
            const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.notice-card').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(el);
            });
        }

        // 页面加载时获取公告
        document.addEventListener('DOMContentLoaded', loadNotices);
    </script>

    <style>
        /* 加载状态 */
        .loading-container, .error-container, .empty-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-icon, .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .error-container p {
            margin-bottom: 20px;
        }
    </style>
</body>
</html>
