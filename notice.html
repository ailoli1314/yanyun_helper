</head>
<body>

                <li><a href="intro.html">脚本介绍</a></li>
                <li><a href="notice.html" class="active">公告</a></li>
            </ul>
            <a href="download/燕云脚本_v1.0.zip" class="nav-download" download>立即下载</a>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>公告中心</h1>
            <p>最新资讯、更新公告、优惠政策</p>
        </div>
    </section>

    <section class="notice-section">
        <div class="container">
            <!-- 加载状态 -->
            <div id="loading" class="loading-container">
                <div class="loading-spinner"></div>
                <p>正在加载公告...</p>
            </div>
            
            <!-- 错误提示 -->
            <div id="error" class="error-container" style="display: none;">
                <div class="error-icon">⚠️</div>
                <p id="error-msg">加载失败，请稍后重试</p>
                <button onclick="loadNotices()" class="btn btn-secondary">重新加载</button>
            </div>

            <!-- 空状态 -->
            <div id="empty" class="empty-container" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>暂无公告</p>
            </div>

            <!-- 公告列表 -->
            <div id="notice-grid" class="notice-grid" style="display: none;"></div>
        </div>
    </section>

    <section class="subscribe-section">
        <div class="container">
            <div class="subscribe-box">
                <h3>📬 订阅更新</h3>
                <p>订阅获取最新公告和更新通知</p>
                <form class="subscribe-form" onsubmit="return false;">
                    <input type="email" placeholder="输入您的邮箱" required>
                    <button type="submit">订阅</button>

    </section>

    <footer>
        <div class="container">
            <div class="footer-content">

                <div class="footer-links">
                    <a href="index.html">首页</a>
                    <a href="intro.html">脚本介绍</a>
                    <a href="download/燕云脚本_v1.0.zip" download>下载</a>
                </div>
                <p class="footer-copyright">© 2026 燕云脚本. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/coze-api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 公告页面配置
        const NOTICE_CONFIG = {
            API_TOKEN: "",  // 在这里设置你的 Coze API Token
            // 如果遇到跨域问题，可以配置代理
            PROXY_URL: ""   // 例如: "https://your-proxy.com/api/coze"
        };

        // 设置 Token
        if (NOTICE_CONFIG.API_TOKEN) {
            CozeAPI.setToken(NOTICE_CONFIG.API_TOKEN);
        }

        // 加载公告
        async function loadNotices() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const emptyEl = document.getElementById('empty');
            const gridEl = document.getElementById('notice-grid');

            // 显示加载状态
            loadingEl.style.display = 'flex';
            errorEl.style.display = 'none';
            emptyEl.style.display = 'none';
            gridEl.style.display = 'none';

            try {
                const notices = await NoticeManager.getNotices();
                
                loadingEl.style.display = 'none';
                
                if (!notices || notices.length === 0) {
                    emptyEl.style.display = 'flex';
                    return;
                }

                // 渲染公告列表
                gridEl.innerHTML = notices.map(notice => `
                    <article class="notice-card">
                        <div class="notice-badge ${notice.type === 'hot' ? 'hot' : ''}">${NoticeManager.getTypeLabel(notice.type)}</div>
                        <div class="notice-date">${notice.date}</div>
                        <h3>${NoticeManager.getTypeEmoji(notice.type)} ${notice.title}</h3>
                        <p>${notice.content}</p>
                        ${notice.link ? `<a href="${notice.link}" class="notice-link">查看详情 →</a>` : ''}
                    </article>
                `).join('');

                gridEl.style.display = 'grid';
                
                // 触发滚动动画
                initScrollAnimations();

            } catch (error) {
                console.error('加载公告失败:', error);
                loadingEl.style.display = 'none';
                document.getElementById('error-msg').textContent = '加载失败: ' + error.message;
                errorEl.style.display = 'flex';
            }
        }

        // 初始化滚动动画
        function initScrollAnimations() {
            const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.notice-card').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(el);
            });
        }

        // 页面加载时获取公告
        document.addEventListener('DOMContentLoaded', loadNotices);
    </script>

    <style>
        /* 加载状态 */
        .loading-container, .error-container, .empty-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-icon, .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .error-container p {
            margin-bottom: 20px;
        }
    </style>
</body>
